<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MaoBTI猫格测试</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="box">
  <h1>🐱 MaoBTI猫格测试（进阶版）</h1>

  <form id="catForm">

    <!-- E / I -->
    <div class="part">
      <h2>一、社交驱动力（外向E / 内向I）</h2>

      <div class="q">
        <p>1. 你回家时它的反应？</p>
        <label><input type="radio" name="E1" value="1" required>无视继续睡</label>
        <label><input type="radio" name="E1" value="2">看一眼不理</label>
        <label><input type="radio" name="E1" value="3">十分钟后靠近</label>
        <label><input type="radio" name="E1" value="4">主动找你</label>
        <label><input type="radio" name="E1" value="5">门口迎接转圈</label>
      </div>

      <div class="q">
        <p>2. 它主动找你互动的频率？</p>
        <label><input type="radio" name="E2" value="1">几乎没有</label>
        <label><input type="radio" name="E2" value="2">偶尔</label>
        <label><input type="radio" name="E2" value="3">一般</label>
        <label><input type="radio" name="E2" value="4">经常</label>
        <label><input type="radio" name="E2" value="5">非常频繁</label>
      </div>

      <div class="q">
        <p>3. 当你长时间不在家，它会？</p>
        <label><input type="radio" name="E3" value="1">完全无所谓</label>
        <label><input type="radio" name="E3" value="2">自己玩</label>
        <label><input type="radio" name="E3" value="3">偶尔找你</label>
        <label><input type="radio" name="E3" value="4">明显更粘人</label>
        <label><input type="radio" name="E3" value="5">守门等你</label>
      </div>
    </div>

    <!-- S / N -->
    <div class="part">
      <h2>二、探索方式（实感S / 直觉N）</h2>

      <div class="q">
        <p>4. 面对一个新箱子，它会？</p>
        <label><input type="radio" name="S1" value="1" required>完全无视</label>
        <label><input type="radio" name="S1" value="2">远远观察</label>
        <label><input type="radio" name="S1" value="3">闻一下</label>
        <label><input type="radio" name="S1" value="4">进去探索</label>
        <label><input type="radio" name="S1" value="5">玩很久</label>
      </div>

      <div class="q">
        <p>5. 新玩具 vs 旧玩具？</p>
        <label><input type="radio" name="S2" value="1">只玩旧的</label>
        <label><input type="radio" name="S2" value="2">偏旧</label>
        <label><input type="radio" name="S2" value="3">都玩</label>
        <label><input type="radio" name="S2" value="4">偏新</label>
        <label><input type="radio" name="S2" value="5">只玩新的</label>
      </div>

      <div class="q">
        <p>6. 家里新增物品，它会？</p>
        <label><input type="radio" name="S3" value="1">完全忽略</label>
        <label><input type="radio" name="S3" value="2">看一眼</label>
        <label><input type="radio" name="S3" value="3">闻一下</label>
        <label><input type="radio" name="S3" value="4">反复研究</label>
        <label><input type="radio" name="S3" value="5">持续探索</label>
      </div>
    </div>

    <!-- T / F -->
    <div class="part">
      <h2>三、情绪反应（理性T / 感性F）</h2>

      <div class="q">
        <p>7. 当你情绪低落时，它会？</p>
        <label><input type="radio" name="T1" value="1" required>完全无反应</label>
        <label><input type="radio" name="T1" value="2">保持距离</label>
        <label><input type="radio" name="T1" value="3">靠近观察</label>
        <label><input type="radio" name="T1" value="4">陪在旁边</label>
        <label><input type="radio" name="T1" value="5">主动安抚你</label>
      </div>

      <div class="q">
        <p>8. 被你训斥后，它会？</p>
        <label><input type="radio" name="T2" value="1">无所谓</label>
        <label><input type="radio" name="T2" value="2">短暂躲开</label>
        <label><input type="radio" name="T2" value="3">过一会儿恢复</label>
        <label><input type="radio" name="T2" value="4">明显情绪低落</label>
        <label><input type="radio" name="T2" value="5">委屈很久</label>
      </div>
    </div>

    <!-- J / P -->
    <div class="part">
      <h2>四、生活控制感（判断J / 感知P）</h2>

      <div class="q">
        <p>9. 吃饭时间是否固定？</p>
        <label><input type="radio" name="J1" value="1" required>非常准时</label>
        <label><input type="radio" name="J1" value="2">基本固定</label>
        <label><input type="radio" name="J1" value="3">大致固定</label>
        <label><input type="radio" name="J1" value="4">偶尔乱</label>
        <label><input type="radio" name="J1" value="5">完全随缘</label>
      </div>

      <div class="q">
        <p>10. 日常流程被打乱（晚喂），它会？</p>
        <label><input type="radio" name="J2" value="1">强烈抗议</label>
        <label><input type="radio" name="J2" value="2">持续催促</label>
        <label><input type="radio" name="J2" value="3">表现不满</label>
        <label><input type="radio" name="J2" value="4">稍微不适</label>
        <label><input type="radio" name="J2" value="5">无所谓</label>
      </div>
    </div>

    <button type="submit" class="submitBtn">生成猫格报告</button>
  </form>
</div>

<script src="script.js"></script>
</body>
</html>
